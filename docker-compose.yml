services:
  tabler:
    container_name: tabler
    build: .
    ports:
      - "3000:3000"
      - "3010:3010"
    env_file:
      - .env
    depends_on:
      - db
    restart: always
    tty: true

  db:
    image: postgres:15-alpine
    container_name: erp_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432" # Mở port ra ngoài để bạn dùng DBeaver remote vào
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: